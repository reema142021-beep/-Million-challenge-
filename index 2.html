<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10213a"><title>تحدّي المليون | النادي الاقتصادي</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#14233b;background:#eef3f8}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#10213a,#234b69);color:white;padding:24px 16px}main{max-width:850px;margin:auto;padding:16px}.top{max-width:850px;margin:auto}h1{margin:0 0 7px;font-size:clamp(25px,5vw,38px)}h2{font-size:22px;margin:0 0 12px}p{line-height:1.8}.muted{color:#627186}.white{color:#dce9f5}.card{background:white;border:1px solid #dce5ef;border-radius:19px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #1834520b}.balance{font-size:clamp(28px,6vw,43px);font-weight:800;color:#087c59;direction:ltr;text-align:right}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#e6f4ef;color:#076f51;border-radius:100px;padding:7px 13px;font-weight:700}.asset{border:1px solid #e0e8f1;border-radius:13px;padding:14px;margin:10px 0}.asset label{font-weight:750}.asset input{width:100%;accent-color:#087c59;margin:14px 0 5px}button{font:inherit;border:0;border-radius:12px;padding:13px 17px;cursor:pointer;font-weight:750;background:#102d50;color:white}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e9eff6;color:#14233b}.danger{background:#a32b38}input[type=text]{font:inherit;border:1px solid #bfcbd9;border-radius:11px;padding:13px;width:100%;margin:8px 0 14px}small{color:#617187}.bar{height:9px;background:#dfe8f1;border-radius:12px;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:#087c59;transition:width .2s}.news{background:#fff5e5;border:1px solid #f3d6a0;border-radius:14px;padding:17px}.gain{color:#087c59}.loss{color:#b52b3a}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:12px 6px;border-bottom:1px solid #e6ebf1}td:last-child,th:last-child{text-align:left}footer{text-align:center;color:#68798b;padding:25px 15px;font-size:13px}.hidden{display:none}.notice{border-right:4px solid #087c59;padding:10px 14px;background:#e9f6f0;border-radius:8px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.buttons button{flex:1;min-width:140px}.badge{font-size:13px;color:#0c6b52;background:#e8f5ef;border-radius:8px;padding:6px 9px}.rounds{display:flex;gap:5px;margin:15px 0}.rounds span{flex:1;height:8px;border-radius:10px;background:#dbe4ee}.rounds .active{background:#087c59}@media(max-width:420px){.card{padding:15px}td,th{font-size:13px;padding:10px 3px}}
</style></head><body><header><div class="top"><div class="row"><strong>🏆 النادي الاقتصادي</strong><span class="badge">لعبة تعليمية مجانية</span></div><h1>تحدّي المليون 💸</h1><div class="white">استثمر، واجه أخبار السوق، وغيّر قراراتك في خمس جولات.</div></div></header><main id="app" aria-live="polite"></main><footer>جميع الأموال والأحداث ونسب العائد افتراضية لأغراض تعليمية فقط، وليست توصيات استثمارية. تحفظ اللعبة تقدمك على هذا المتصفح فقط.</footer><script>
'use strict';
const KEY='million-challenge-v1',START=1000000;
const assets=[{name:'الأسهم',emoji:'📈'},{name:'العقارات',emoji:'🏘️'},{name:'المشاريع الخاصة',emoji:'🏪'},{name:'النقد والادخار',emoji:'💵'}];
const events=[{title:'ارتفاع أسعار الفائدة',body:'تراجعت بعض الاستثمارات مع ارتفاع تكلفة التمويل. هذه النسب افتراضية لأغراض اللعبة.',rates:[-10,-7,-5,1]},{title:'انتعاش اقتصادي',body:'تحسّن النشاط الاقتصادي وزاد الطلب على المنتجات والأصول.',rates:[16,8,19,1]},{title:'ارتفاع التضخم',body:'ارتفعت تكاليف الإنتاج وتباين أداء الأصول.',rates:[-8,6,-12,1]},{title:'طفرة في الابتكار',body:'زاد الإقبال على الشركات والمشاريع المبتكرة.',rates:[14,2,22,1]},{title:'تباطؤ مفاجئ',body:'انخفض الطلب وتراجعت شهية المخاطرة.',rates:[-15,-9,-18,1]}];
const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x.name==='string'&&Number.isFinite(x.balance)&&x.balance>=0&&Number.isInteger(x.round)&&x.round>=0&&x.round<=5&&['allocate','news','result','done'].includes(x.phase)&&Array.isArray(x.history))return x}catch(e){}return null}
let game=load();let draft=[25,25,25,25];const app=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){alert('تعذّر حفظ التقدم على هذا المتصفح. تحقّق من إعدادات التخزين.')}}
function reset(){if(confirm('هل تريد بدء لعبة جديدة؟ سيُحذف تقدمك الحالي من هذا المتصفح.')){localStorage.removeItem(KEY);game=null;draft=[25,25,25,25];render()}}
function intro(){app.innerHTML=`<section class="card"><h2>أهلًا بك في تحدّي المليون!</h2><p>ابدأ بمليون ريال افتراضي. وزّع أموالك على أربعة مجالات، ثم اكتشف الخبر الاقتصادي ونتيجة قرارك. يمكنك إعادة توزيع ثروتك في الجولة التالية.</p><label for="name">اسم اللاعب</label><input id="name" type="text" maxlength="35" placeholder="اكتب اسمك هنا" autocomplete="nickname"><button id="start">ابدأ اللعبة ←</button><p><small>لا تحتاج إلى حساب. سيُحفظ تقدمك على هذا الجهاز والمتصفح فقط؛ لا توجد لوحة متصدرين مشتركة.</small></p></section>`;document.getElementById('start').onclick=()=>{const name=document.getElementById('name').value.trim();if(!name){alert('اكتب اسمك أولًا');return}game={name,balance:START,round:0,phase:'allocate',history:[],allocation:null};save();render()}}
function shell(title,content){app.innerHTML=`<section class="card"><div class="row"><span class="pill">الجولة ${Math.min(game.round+1,5)} من 5</span><button class="secondary" id="reset" type="button">بدء من جديد</button></div><div class="rounds">${events.map((_,i)=>`<span class="${i<=game.round?'active':''}"></span>`).join('')}</div><small>اللاعب: ${esc(game.name)}</small><h2>${title}</h2><div class="muted">ثروتك الحالية</div><div class="balance">${fmt(game.balance)} ر.س</div></section>${content}`;document.getElementById('reset').onclick=reset}
function allocate(){const sum=draft.reduce((a,b)=>a+b,0);shell('وزّع ثروتك',`<section class="card"><p>اختَر نسب الاستثمار. مجموع النسب يجب أن يساوي 100٪. يمكنك تعديل التوزيع قبل التأكيد.</p><div id="asset-list">${assets.map((a,i)=>`<div class="asset"><div class="row"><label for="s${i}">${a.emoji} ${a.name}</label><strong id="p${i}">${draft[i]}٪</strong></div><input id="s${i}" type="range" min="0" max="100" step="5" value="${draft[i]}" aria-label="نسبة ${a.name}"><small id="v${i}">${fmt(game.balance*draft[i]/100)} ر.س</small></div>`).join('')}</div><div class="row"><strong id="total">المجموع: ${sum}٪</strong><small id="remaining">المتبقي: ${100-sum}٪</small></div><div class="bar"><div id="fill" style="width:${Math.min(sum,100)}%"></div></div><div class="buttons"><button class="secondary" id="equal">توزيع متساوٍ</button><button id="confirm" ${sum!==100?'disabled':''}>تأكيد الاستثمار</button></div></section>`);const update=()=>{let s=draft.reduce((a,b)=>a+b,0);draft.forEach((v,i)=>{document.getElementById('s'+i).value=v;document.getElementById('p'+i).textContent=v+'٪';document.getElementById('v'+i).textContent=fmt(game.balance*v/100)+' ر.س'});document.getElementById('total').textContent='المجموع: '+s+'٪';document.getElementById('remaining').textContent=s>100?'تجاوزت الميزانية بـ '+(s-100)+'٪':'المتبقي: '+(100-s)+'٪';document.getElementById('fill').style.width=Math.min(s,100)+'%';document.getElementById('confirm').disabled=s!==100};draft.forEach((_,i)=>document.getElementById('s'+i).oninput=e=>{draft[i]=Number(e.target.value);update()});document.getElementById('equal').onclick=()=>{draft=[25,25,25,25];update()};document.getElementById('confirm').onclick=()=>{if(draft.reduce((a,b)=>a+b,0)!==100)return;game.allocation=[...draft];game.phase='news';save();render()}}
function news(){const ev=events[game.round];shell('📰 خبر اقتصادي عاجل',`<section class="card"><div class="news"><h2>${ev.title}</h2><p>${ev.body}</p></div><p>تم تثبيت استثماراتك. اضغط لكشف تأثير الخبر على محفظتك.</p><div class="buttons"><button id="reveal">اكشف النتيجة</button></div></section>`);document.getElementById('reveal').onclick=()=>{if(game.phase!=='news')return;const before=game.balance;const parts=game.allocation.map((pct,i)=>{const original=before*pct/100;const after=Math.round(original*(1+ev.rates[i]/100));return{original,after,rate:ev.rates[i]}});const after=parts.reduce((s,p)=>s+p.after,0);game.history.push({title:ev.title,before,after,parts});game.balance=after;game.phase='result';save();render()}}
function result(){const h=game.history[game.history.length-1],delta=h.after-h.before;const last=game.round===4;shell(last?'نتيجة الجولة الأخيرة':'نتيجة الجولة',`<section class="card"><div class="notice">${esc(h.title)}</div><h2 class="${delta>=0?'gain':'loss'}">${delta>=0?'+':''}${fmt(delta)} ر.س</h2><p>ثروتك بعد الخبر: <strong>${fmt(h.after)} ر.س</strong></p><table><thead><tr><th>الاستثمار</th><th>التغير</th><th>القيمة الجديدة</th></tr></thead><tbody>${h.parts.map((p,i)=>`<tr><td>${assets[i].emoji} ${assets[i].name}</td><td class="${p.rate>=0?'gain':'loss'}">${p.rate>0?'+':''}${p.rate}٪</td><td>${fmt(p.after)}</td></tr>`).join('')}</tbody></table><p><small>الأرباح والخسائر تُحسب وفق نسب افتراضية ثابتة، ولا تعكس أسعار السوق الفعلية.</small></p><div class="buttons"><button id="next">${last?'اعرض نتيجتي النهائية':'إعادة توزيع ثروتي للجولة التالية ←'}</button></div></section>`);document.getElementById('next').onclick=()=>{if(game.phase!=='result')return;if(last){game.phase='done'}else{game.round++;game.phase='allocate';draft=[25,25,25,25]}save();render()}}
function done(){const gain=game.balance-START;shell('🏆 انتهى تحدّي المليون!',`<section class="card"><h2>أحسنت يا ${esc(game.name)}!</h2><p>ثروتك النهائية: <strong>${fmt(game.balance)} ر.س</strong></p><p class="${gain>=0?'gain':'loss'}">${gain>=0?'ربح':'خسارة'}: ${fmt(Math.abs(gain))} ر.س (${(gain/START*100).toFixed(2)}٪)</p><h2>سجل الجولات</h2><table><thead><tr><th>الجولة</th><th>الخبر</th><th>الثروة</th></tr></thead><tbody>${game.history.map((h,i)=>`<tr><td>${i+1}</td><td>${esc(h.title)}</td><td>${fmt(h.after)}</td></tr>`).join('')}</tbody></table><div class="buttons"><button id="share">نسخ نتيجتي</button><button class="secondary" id="again">العب مجددًا</button></div><p><small>يمكنك إرسال نتيجتك للنادي بنفسك. لا يجمع الموقع النتائج تلقائيًا.</small></p></section>`);document.getElementById('again').onclick=reset;document.getElementById('share').onclick=async()=>{const msg=`تحدّي المليون 🏆\nاللاعب: ${game.name}\nالثروة النهائية: ${fmt(game.balance)} ر.س\n${gain>=0?'الربح':'الخسارة'}: ${fmt(Math.abs(gain))} ر.س`;try{if(navigator.share)await navigator.share({text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);alert('تم نسخ نتيجتك')}else prompt('انسخ نتيجتك:',msg)}catch(e){if(e.name!=='AbortError')prompt('انسخ نتيجتك:',msg)}}}
function render(){if(!game){intro();return}if(game.phase==='allocate')allocate();else if(game.phase==='news')news();else if(game.phase==='result')result();else done()}render();
</script></body></html>
